<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Moves</title>
  <meta name="theme-color" content="#1E5C42">
  <style>
    :root { --bg:#F5F4F0; --ink:#18181A; --muted:#6b6b70; --accent:#1E5C42; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink);
      font-family: Inter, system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;
    }
    .card { max-width: 340px; }
    .mark { width: 72px; height: 72px; margin: 0 auto 20px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button {
      font: inherit; font-weight: 500; color: #fff; background: var(--accent);
      border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" rx="112" fill="#1E5C42"/>
      <path d="M148 320 L232 236 L296 300 L392 204" fill="none" stroke="#F5F4F0"
            stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="392" cy="204" r="30" fill="#F5F4F0"/>
    </svg>
    <h1>You're offline</h1>
    <p>Moves can't reach the server right now. Reconnect to pick up where you left off.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
